<section id="contact" class="contact section">

  <div class="container section-title py-4" data-aos="fade-up">
    <h2>Contact Us</h2>
    <h2 class="enquiry-container">Enquiry Request</h2>
    <p>Please let us know what service you are interested in by completing the form below. We will get in touch with you shortly.</p>
  </div>

    <div class="container" data-aos="fade-up" data-aos-delay="100">

      <div class="mb-4" data-aos="fade-up" data-aos-delay="200">
        <iframe style="border:0; width: 100%; height: 270px;"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d241317.11609928335!2d73.8582412!3d18.4584717!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2eac0def4b10f%3A0x28847163352dbcab!2sNancy+Lake+Homes+Society!5e0!3m2!1sen!2sin!4v1674567890123"
        frameborder="0" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div><!-- End Google Maps -->

      <div class="row gy-4">

        <div class="col-lg-4">
          <div class="info-item d-flex" data-aos="fade-up" data-aos-delay="300">
            <i class="bi bi-geo-alt flex-shrink-0"></i>
            <div>
              <h3>Address</h3>
              <p>A108 Adam Street, New York, NY 535022</p>
            </div>
          </div><!-- End Info Item -->

          <div class="info-item d-flex" data-aos="fade-up" data-aos-delay="400">
            <i class="bi bi-telephone flex-shrink-0"></i>
            <div>
              <h3>Call Us</h3>
              <p>+1 5589 55488 55</p>
            </div>
          </div><!-- End Info Item -->

          <div class="info-item d-flex" data-aos="fade-up" data-aos-delay="500">
            <i class="bi bi-envelope flex-shrink-0"></i>
            <div>
              <h3>Email Us</h3>
              <p>info&#64;example.com</p>
            </div>
          </div><!-- End Info Item -->

        </div>

        <div class="col-lg-8">
          <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="php-email-form" data-aos="fade-up" data-aos-delay="200">
            <div class="row gy-4">
              <div class="col-md-6">
                <input type="text" formControlName="name" class="form-control" placeholder="Your Name" required />
              </div>
        
              <div class="col-md-6">
                <input type="email" formControlName="email" class="form-control" placeholder="Your Email" required />
              </div>
        
              <div class="col-md-12">
                <input type="text" formControlName="subject" class="form-control" placeholder="Subject" required />
              </div>
        
              <div class="col-md-12">
                <textarea formControlName="message" class="form-control" rows="6" placeholder="Message" required></textarea>
              </div>
        
              <div class="col-md-12 text-center">
                <div class="error-message" *ngIf="contactForm.invalid && contactForm.touched">
                  Please fill out the form correctly.
                </div>
        
                <button type="submit" class="btn btn-outline-dark" [disabled]="contactForm.invalid">Send Message</button>
              </div>
            </div>
          </form>
        </div>
        <!-- End Contact Form -->

      </div>

    </div>

  </section>
